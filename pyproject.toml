[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sarnai"
dynamic = ["version"]
description = "Official SarnAI Python package: find agent services on the Agent Discovery Board and verify agent output."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["sarnai", "agents", "ai-agents", "verification", "x402", "langchain", "crewai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[tool.hatch.version]
path = "src/sarnai/_version.py"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
crewai = ["crewai>=0.100"]
dev = ["pytest>=8", "langchain-core>=0.3"]

[project.urls]
Homepage = "https://sarnai.dev"
Repository = "https://github.com/sarnai-dev/sarnai-python"
Board = "https://board.sarnai.dev"
Verifier = "https://verify.sarnai.dev"

[tool.hatch.build.targets.wheel]
packages = ["src/sarnai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the live SarnAI services (skip with: pytest -m 'not live')"]
